<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pinecart checkout</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#183128;font:18px system-ui,sans-serif}main{max-width:640px;margin:8vh auto;padding:32px}header{font-weight:750;font-size:26px}article{background:white;border:1px solid #dce3dc;border-radius:20px;padding:32px;margin-top:32px}small{color:#52675c}h1{font-size:38px;line-height:1.1}button{background:#194f37;color:white;border:0;border-radius:10px;padding:18px;width:100%;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#result{white-space:pre-wrap;line-height:1.5;margin-top:24px}.error{color:#a52c27}.success{color:#17613b}.row{display:flex;justify-content:space-between;padding:24px 0}footer{margin-top:24px;font-size:14px;color:#52675c}
</style></head><body><main><header>pinecart</header><article><small>Sandbox checkout · No real payment</small><h1>One last step.</h1><p>Your order is ready.</p><div class="row"><span>Everyday tote × 1</span><strong>$42.00</strong></div><button id="pay">Pay $42.00</button><div id="result" role="status" aria-live="polite"></div></article><footer>Synthetic customer and payment data. A timeout and retry are simulated by the local payment service.</footer></main><script>
const pay=document.querySelector('#pay'),result=document.querySelector('#result');
pay.addEventListener('click',async()=>{pay.disabled=true;result.className='';result.textContent='Processing your sandbox payment…';try{const response=await fetch('/api/checkout',{method:'POST'});const data=await response.json();result.className=data.success?'success':'error';result.textContent=data.error||(data.success?'Payment successful. Your order is confirmed.':'Checkout failed: duplicate payment detected.')+'\n'+(data.chargeCount!==undefined?'Recorded charges: '+data.chargeCount+'\nTotal recorded: $'+(data.totalCharged/100).toFixed(2)+'\n'+data.message:'');}catch{result.className='error';result.textContent='Unable to reach the local checkout service.';}finally{pay.disabled=false;}});
</script></body></html>
